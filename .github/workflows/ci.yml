name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go agents: lint + test ─────────────────────────────────────────────────
  lint-go:
    name: lint-go (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [classifier, knowledge, responder, escalation]
    defaults:
      run:
        working-directory: agents/${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agents/${{ matrix.agent }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: agents/${{ matrix.agent }}
          args: --timeout=5m

      - name: go test
        run: go test -race -count=1 ./...

  # ── Python: lint + test ────────────────────────────────────────────────────
  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: pip install ruff pytest pytest-asyncio

      - name: ruff check
        run: |
          ruff check orchestrator/ llm_agent/ dashboard/
          # api/ is an optional future directory; skip if absent
          if [ -d api/ ]; then ruff check api/; fi

      - name: pytest
        run: |
          # Tests live at package root (e.g. orchestrator/auction_test.py).
          # api/tests/ is skipped until the api/ package is added.
          pytest orchestrator/ --asyncio-mode=auto -v
          if [ -d api/tests/ ]; then pytest api/tests/ --asyncio-mode=auto -v; fi

  # ── Docker build verification ──────────────────────────────────────────────
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build

      - name: Verify expected images exist
        run: |
          project="lab13-mas-support"
          failed=0
          for svc in classifier knowledge responder escalation orchestrator dashboard; do
            image="${project}-${svc}"
            if docker image inspect "${image}" >/dev/null 2>&1; then
              echo "✓  ${image}"
            else
              echo "✗  MISSING: ${image}"
              failed=1
            fi
          done
          exit $failed

  # ── Automated code review via Claude API (PR only) ────────────────────────
  auto-review:
    name: auto-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so git diff can compare base..head
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install anthropic SDK
        run: pip install anthropic

      - name: Run auto-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/auto_review.py
