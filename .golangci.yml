run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - gosimple
    - ineffassign
    - staticcheck
    - unused
    # errcheck is intentionally omitted: `defer nc.Drain()`, `defer shutdown(ctx)`,
    # and `defer store.Close()` are standard Go deferred-cleanup idioms that discard
    # errors deliberately — errcheck would flag all of them as unchecked.

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-SA1019"  # allow deprecated API use (OTel SDK internals)

issues:
  max-same-issues: 0
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - unused
