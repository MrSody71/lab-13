version: "3.9"

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  classifier:
    build: ./agents/classifier
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=classifier-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - nats
      - jaeger
    restart: on-failure

  knowledge:
    build: ./agents/knowledge
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=knowledge-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - jaeger
      - redis
    restart: on-failure

  responder:
    build: ./agents/responder
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=responder-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - nats
      - jaeger
    restart: on-failure

  escalation:
    build: ./agents/escalation
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=escalation-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - nats
      - jaeger
    restart: on-failure

  orchestrator:
    build: ./orchestrator
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_MONITOR_URL=http://nats:8222
      - OTEL_SERVICE_NAME=orchestrator
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CLASSIFIER_IMAGE=lab13-mas-support-classifier
      - DOCKER_NETWORK=lab13-mas-support_default
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nats
      - jaeger
      - classifier
      - knowledge
      - responder
      - escalation
    restart: on-failure
