name: lab13-mas-support

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  classifier:
    build: ./agents/classifier
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=classifier-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: on-failure

  knowledge:
    build: ./agents/knowledge
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=knowledge-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure

  responder:
    build: ./agents/responder
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=responder-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: on-failure

  escalation:
    build: ./agents/escalation
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_SERVICE_NAME=escalation-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: on-failure

  orchestrator:
    build: ./orchestrator
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_MONITOR_URL=http://nats:8222
      - REDIS_URL=redis://redis:6379
      - OTEL_SERVICE_NAME=orchestrator
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CLASSIFIER_IMAGE=lab13-mas-support-classifier
      - DOCKER_NETWORK=lab13-mas-support_default
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      classifier:
        condition: service_started
      knowledge:
        condition: service_started
      responder:
        condition: service_started
      escalation:
        condition: service_started
    restart: on-failure

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_MONITOR_URL=http://nats:8222
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  llm_agent:
    build: ./llm_agent
    profiles:
      - llm
    environment:
      - NATS_URL=nats://nats:4222
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure
